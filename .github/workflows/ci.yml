name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Slim deps only — unit tests must never need torch/earth2studio or network.
      - run: pip install -r requirements-ci.txt
      - run: ruff check app agent tests
      - run: pytest -q
